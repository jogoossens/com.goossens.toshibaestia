<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- App icon: refined "T" silhouette, opaque on transparent canvas, for
       Homey's CSS mask-image rendering against the brand-red card.

       Proportions tuned closer to the Toshiba corporate T:
         · Stroke weight 40 (uniform: bar height = stem width)
         · Bar 160 wide → 4× the stroke weight, gives the T proper shoulders
         · Stem 160 tall → matches the bar width for a balanced cap height
         · Letter is 200 tall, vertically centred in the 256 viewBox
         · No background — only the silhouette is opaque -->

  <!-- Horizontal bar of the T -->
  <rect x="48" y="28" width="160" height="40" fill="#000000"/>

  <!-- Vertical stem of the T -->
  <rect x="108" y="68" width="40" height="160" fill="#000000"/>
</svg>

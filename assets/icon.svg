<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256">
  <!-- App icon: bold "T" in white on Toshiba red, embedded as a 512x512 PNG
       inside the SVG. Several previous attempts using vector primitives
       (single path, two rects) were misrendered by the developer dashboard's
       icon thumbnail pipeline as a plain white square. Embedding a raster
       removes any SVG-interpretation step — the renderer just paints the
       baked image. -->
  <image x="0" y="0" width="256" height="256"
         preserveAspectRatio="xMidYMid meet"
         xlink:href="data:image/png;base64,"/>
</svg>

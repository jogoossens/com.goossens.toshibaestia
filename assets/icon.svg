<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- All-filled silhouette of an outdoor heat-pump unit:
         · cabinet frame (filled rect minus inner rect, evenodd)
         · fan grille ring (filled outer circle minus inner circle, evenodd)
         · fan hub (circle) + three blades at 120° (pre-computed polygons —
           librsvg/IM ignores the centre coords in `rotate(angle cx cy)`,
           so we encode the rotated vertices directly)
         · three air-flow triangles below the cabinet
       Every shape has solid mass and uses currentColor so the platform
       can re-tint it for any theme. -->

  <!-- Cabinet frame -->
  <path fill="currentColor" fill-rule="evenodd"
        d="M 44 40 a 12 12 0 0 0 -12 12 v 124 a 12 12 0 0 0 12 12 h 168 a 12 12 0 0 0 12 -12 v -124 a 12 12 0 0 0 -12 -12 z
           M 54 54 a 8 8 0 0 0 -8 8 v 112 a 8 8 0 0 0 8 8 h 148 a 8 8 0 0 0 8 -8 v -112 a 8 8 0 0 0 -8 -8 z"/>

  <!-- Fan grille ring (centre 128,114; outer r=52, inner r=36) -->
  <path fill="currentColor" fill-rule="evenodd"
        d="M 128 62 A 52 52 0 0 1 128 166 A 52 52 0 0 1 128 62 z
           M 128 78 A 36 36 0 0 1 128 150 A 36 36 0 0 1 128 78 z"/>

  <!-- Fan hub -->
  <circle fill="currentColor" cx="128" cy="114" r="8"/>

  <!-- Three fan blades — rotated polygons pre-computed at 0°, 120°, 240° -->
  <g fill="currentColor">
    <polygon points="125,78 131,78 131,110 125,110"/>
    <polygon points="160.68,129.4 157.68,134.6 129.96,118.6 132.96,113.4"/>
    <polygon points="98.32,134.6 95.32,129.4 123.04,113.4 126.04,118.6"/>
  </g>

  <!-- Air-flow chevrons below cabinet (down-pointing triangles) -->
  <g fill="currentColor">
    <polygon points="50,200 90,200 70,222"/>
    <polygon points="108,200 148,200 128,222"/>
    <polygon points="166,200 206,200 186,222"/>
  </g>
</svg>

<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- App icon: bare bold "T" shape, opaque on otherwise transparent canvas.
       Homey renders icons with CSS `mask-image: url(icon.svg)` against the
       app's brandColor (red) — opaque mask pixels reveal the colour, and a
       white inner element (or transparent context) shows through where the
       mask is transparent. So an SVG with a red background rect of its own
       turns the whole icon into a solid red mask block; only the silhouette
       must be opaque, the rest must be transparent.

       Result on Homey: a white T on the red brand-card. Same pattern as
       the heat-pump silhouette used by the device driver. -->

  <!-- Horizontal bar of the T -->
  <rect x="40" y="56" width="176" height="56" fill="#000000"/>

  <!-- Vertical stem of the T -->
  <rect x="100" y="112" width="56" height="104" fill="#000000"/>
</svg>

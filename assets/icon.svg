<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- App icon: bold capital "T" composed from two simple <rect> primitives
       (horizontal bar + vertical stem). A previous attempt drew the T as a
       single multi-vertex <path> using H/V commands; the Athom dashboard
       thumbnail rendered it as just the bounding square instead of the T
       cutout. Switching to <rect> elements eliminates the path-interpretation
       step entirely. -->

  <!-- Toshiba-red rounded square card -->
  <rect x="0" y="0" width="256" height="256" rx="40" ry="40" fill="#E60012"/>

  <!-- Horizontal bar of the T -->
  <rect x="40" y="56" width="176" height="56" fill="#FFFFFF"/>

  <!-- Vertical stem of the T -->
  <rect x="100" y="112" width="56" height="104" fill="#FFFFFF"/>
</svg>

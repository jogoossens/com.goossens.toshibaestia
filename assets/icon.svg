<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Solid-silhouette outdoor heat pump cabinet with fan rotor.
       Solid-fill renders reliably under platform icon-masking
       (thin strokes can wash out). currentColor lets the platform
       re-tint to match the theme. -->
  <!-- Cabinet, solid filled -->
  <rect x="80" y="160" width="864" height="704" rx="80" ry="80" fill="currentColor"/>
  <!-- Fan area cutout (transparent so the cabinet shows the brand card behind) -->
  <circle cx="512" cy="512" r="280" fill="#ffffff"/>
  <circle cx="512" cy="512" r="280" fill="none" stroke="currentColor" stroke-width="32"/>
  <!-- Three swept fan blades, solid filled -->
  <g fill="currentColor">
    <path d="M512 280 Q620 340 600 480 Q540 510 480 380 Z"/>
    <path d="M512 280 Q620 340 600 480 Q540 510 480 380 Z" transform="rotate(120 512 512)"/>
    <path d="M512 280 Q620 340 600 480 Q540 510 480 380 Z" transform="rotate(240 512 512)"/>
    <!-- Fan hub -->
    <circle cx="512" cy="512" r="44"/>
  </g>
</svg>
